name: Publish desktop installers

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
          - name: Windows (64-bit)
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up npm
        run: npm install --global npm@12.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate Apple release credentials
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          configured=0
          for value in \
            "$APPLE_CERTIFICATE" \
            "$APPLE_CERTIFICATE_PASSWORD" \
            "$APPLE_ID" \
            "$APPLE_PASSWORD" \
            "$APPLE_TEAM_ID"; do
            if [[ -n "$value" ]]; then
              configured=$((configured + 1))
            fi
          done

          if [[ "$configured" -ne 0 && "$configured" -ne 5 ]]; then
            echo "Apple signing is only partially configured." >&2
            echo "Set APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID, or leave all five unset for ad-hoc signing." >&2
            exit 1
          fi

          if [[ "$configured" -eq 5 ]]; then
            echo "APPLE_SIGNING_MODE=developer-id" >> "$GITHUB_ENV"
            echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
          else
            echo "APPLE_SIGNING_MODE=adhoc" >> "$GITHUB_ENV"
          fi

      - name: Import Apple Developer ID certificate
        if: runner.os == 'macOS' && env.APPLE_SIGNING_MODE == 'developer-id'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          certificate_path="$RUNNER_TEMP/apple-developer-id.p12"
          keychain_path="$RUNNER_TEMP/human-typer-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          signing_identity="$(security find-identity -v -p codesigning "$keychain_path" | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          if [[ -z "$signing_identity" ]]; then
            echo "The imported certificate does not contain a valid Developer ID Application identity." >&2
            exit 1
          fi

          echo "APPLE_SIGNING_IDENTITY=$signing_identity" >> "$GITHUB_ENV"

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Human Typer v__VERSION__
          releaseBody: |
            Human Typer 0.5.0 incorpora un compañero web para escribir en Google Docs, Word Online y otros editores sin mantener el foco en la ventana, con extensión compatible con Chrome, Edge y Firefox incluida dentro de la aplicación.

            También suma nuevos presets de velocidad lenta y pausada, control de variación en la extensión y avisos sonoros y de escritorio al finalizar.

            En macOS, el paquete conserva la firma ad hoc válida y admite firma Developer ID con notarización cuando están configuradas las credenciales de Apple.

            Descargas:
            - Windows: instalador `.exe` de 64 bits.
            - macOS: imagen `.dmg` para Apple Silicon.
            - Extensión Navegadores: `Human-Typer-Extension.zip` (para Chrome, Edge y Firefox).

            En macOS, habilitá Human Typer en Configuración del Sistema → Privacidad y seguridad → Accesibilidad.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          args: ${{ matrix.args }}
          releaseAssetNamePattern: Human-Typer_[version]_[platform]_[arch][_setup].[ext]

      - name: Package browser extension
        if: runner.os == 'Windows'
        shell: bash
        run: |
          tar -a -c -f Human-Typer-Extension.zip -C chrome-extension .

      - name: Upload browser extension to release assets
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          files: Human-Typer-Extension.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dmg_path="$(find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
          mount_path="$RUNNER_TEMP/human-typer-dmg"

          if [[ -z "$dmg_path" ]]; then
            echo "The macOS DMG was not generated." >&2
            exit 1
          fi

          mkdir -p "$mount_path"
          hdiutil verify "$dmg_path"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_path" "$dmg_path"
          trap 'hdiutil detach "$mount_path"' EXIT

          app_path="$mount_path/Human Typer.app"
          codesign --verify --deep --strict --verbose=2 "$app_path"

          if [[ "$APPLE_SIGNING_MODE" == "developer-id" ]]; then
            spctl --assess --type execute --verbose=2 "$app_path"
            xcrun stapler validate "$app_path"
          fi
