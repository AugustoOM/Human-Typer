<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Human Typer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="popup-container">
      <header class="header">
        <div class="brand">
          <span class="logo-badge">⚡</span>
          <div>
            <h2>Human <span>Typer</span></h2>
            <span class="badge">Background</span>
          </div>
        </div>
      </header>

      <main class="main">
        <div class="field-group">
          <label for="text-input">
            <span>Text to type</span>
            <span id="char-count" class="char-count">0 characters</span>
          </label>
          <textarea
            id="text-input"
            placeholder="Paste or type the text to enter in the document..."
            rows="5"
          ></textarea>
        </div>

        <div class="settings-block">
          <div class="setting-row">
            <label>Typing speed</label>
            <strong id="speed-val">120 ms (Normal)</strong>
          </div>

          <div class="preset-buttons" role="group" aria-label="Speed presets">
            <button type="button" class="preset-btn" data-speed="35">
              ⚡ Very Fast
            </button>
            <button type="button" class="preset-btn" data-speed="65">
              🚀 Fast
            </button>
            <button type="button" class="preset-btn active" data-speed="120">
              ✍️ Normal
            </button>
            <button type="button" class="preset-btn" data-speed="220">
              🐢 Slow
            </button>
            <button type="button" class="preset-btn" data-speed="380">
              🦥 Very Slow
            </button>
          </div>

          <input
            type="range"
            id="speed-slider"
            min="15"
            max="800"
            step="5"
            value="120"
          />
          <div class="speed-labels">
            <span>15 ms (Ultra Fast)</span>
            <span>800 ms (Paused)</span>
          </div>
        </div>

        <div class="settings-block compact">
          <div class="setting-row">
            <label>Human variation</label>
            <strong id="variation-val">±35 ms</strong>
          </div>
          <input
            type="range"
            id="variation-slider"
            min="0"
            max="150"
            step="5"
            value="35"
          />
        </div>

        <div class="options-grid">
          <label class="toggle-label">
            <input type="checkbox" id="pause-punct" checked />
            <span>Punctuation pauses</span>
          </label>
          <label class="toggle-label">
            <input type="checkbox" id="notify-sound" checked />
            <span>Completion sound</span>
          </label>
        </div>

        <div id="status-card" class="status-card">
          <div class="status-info">
            <span id="status-text">Ready to start in this tab</span>
            <span id="status-percent">0%</span>
          </div>
          <div class="progress-bg">
            <div id="progress-bar" class="progress-fill"></div>
          </div>
        </div>

        <div class="actions">
          <button type="button" id="start-btn" class="btn btn-primary">
            ▶ Start Typing
          </button>
          <div id="control-buttons" class="control-row" style="display: none">
            <button type="button" id="pause-btn" class="btn btn-secondary">
              ⏸ Pause
            </button>
            <button type="button" id="cancel-btn" class="btn btn-danger">
              ✕ Cancel
            </button>
          </div>
        </div>
      </main>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
